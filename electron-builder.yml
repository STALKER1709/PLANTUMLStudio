appId: com.plantumlstudio.app
productName: PlantUML Studio
copyright: © 2025 PlantUML Studio

directories:
  output: release
  # Les icônes sont détectées automatiquement dans build/ :
  # icon.ico (Windows), icon.icns (macOS), icon.png (Linux, 512x512 minimum).
  # Sans elles, electron-builder utilise l'icône Electron par défaut.
  buildResources: build

files:
  - dist/**/*
  - package.json
  - '!**/*.map'

# Ressources non empaquetées dans l'asar : plantuml.jar doit rester un fichier
# accessible au processus Java, et les modèles sont lus tels quels.
extraResources:
  - from: resources/
    to: resources/
    filter:
      - '**/*'
      - '!**/.gitkeep'
  - from: templates/
    to: templates/
  # Icône lue à l'exécution pour la fenêtre et la barre des tâches.
  - from: build/icons/256x256.png
    to: icon.png

asar: true
compression: maximum

win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  language: '1036' # français
  installerLanguages:
    - fr_FR
    - en_US

mac:
  target: dmg
  category: public.app-category.developer-tools
  hardenedRuntime: true

linux:
  # Champ obligatoire pour les paquets .deb et .rpm.
  maintainer: STALKER1709 <144211603+STALKER1709@users.noreply.github.com>
  # Jeu de tailles normalisées : pointé sur build/icon.png seul, electron-builder
  # crée un dossier « 1254x1254 » que les thèmes d'icônes freedesktop ignorent,
  # et le lanceur retombe alors sur une icône générique.
  icon: build/icons
  target:
    - deb
    - rpm
    - AppImage
  # « category » alimente le champ Categories du fichier .desktop.
  category: Development;IDE;
  desktop:
    entry:
      # Comment est repris de la description du package.json.
      Keywords: UML;PlantUML;diagramme;modélisation;

# Aucune publication automatique : les mises à jour se font par installateur
# transmis hors ligne (clé USB, partage local).
publish: null
