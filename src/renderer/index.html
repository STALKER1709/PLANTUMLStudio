<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Politique de sécurité stricte : aucune ressource distante n'est
      autorisée. `ws://localhost:5173` sert uniquement au rechargement à chaud
      de Vite en développement et reste inerte dans l'application packagée.
      `unsafe-inline` pour les styles est imposé par Monaco Editor.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob:;
               font-src 'self' data:;
               worker-src 'self' blob:;
               connect-src 'self' ws://localhost:5173 http://localhost:5173;
               base-uri 'none';
               form-action 'none';
               frame-src 'none';
               object-src 'none';"
    />
    <title>PlantUML Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
